<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Blurman below 32 px: no window bar, a thicker edge so the glass still reads. -->
  <defs>
    <radialGradient id="orb" cx="35%" cy="32%" r="75%"><stop offset="0" stop-color="#FFE29A"/><stop offset=".45" stop-color="#FF8A5B"/><stop offset="1" stop-color="#E8467C"/></radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#0E9F8E"/></linearGradient>
    <clipPath id="pane"><rect x="36" y="68" width="172" height="152" rx="30"/></clipPath>
    <filter id="frost" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <circle cx="168" cy="82" r="64" fill="url(#orb)"/>
  <circle cx="62" cy="196" r="38" fill="url(#teal)"/>
  <g clip-path="url(#pane)">
    <rect x="36" y="68" width="172" height="152" fill="#EAF2FF"/>
    <g filter="url(#frost)"><circle cx="168" cy="82" r="64" fill="url(#orb)"/><circle cx="62" cy="196" r="38" fill="url(#teal)"/></g>
  </g>
  <rect x="41" y="73" width="162" height="142" rx="25" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <rect x="35" y="67" width="174" height="154" rx="31" fill="none" stroke="#1E2A4A" stroke-opacity=".35" stroke-width="8"/>
</svg>
