<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Blurman: a pane of frosted glass in front of a bright orb and a teal disc, sharp where they
       stick out and soft behind the glass. The full icon, for 32 px and up. -->
  <defs>
    <radialGradient id="orb" cx="35%" cy="32%" r="75%"><stop offset="0" stop-color="#FFE29A"/><stop offset=".45" stop-color="#FF8A5B"/><stop offset="1" stop-color="#E8467C"/></radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#0E9F8E"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/></linearGradient>
    <clipPath id="pane"><rect x="36" y="68" width="172" height="152" rx="30"/></clipPath>
    <filter id="frost" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <circle cx="168" cy="82" r="64" fill="url(#orb)"/>
  <circle cx="62" cy="196" r="38" fill="url(#teal)"/>
  <g clip-path="url(#pane)">
    <rect x="36" y="68" width="172" height="152" fill="#EAF2FF"/>
    <g filter="url(#frost)"><circle cx="168" cy="82" r="64" fill="url(#orb)"/><circle cx="62" cy="196" r="38" fill="url(#teal)"/></g>
    <rect x="36" y="68" width="172" height="152" fill="url(#sheen)"/>
  </g>
  <rect x="60" y="92" width="46" height="9" rx="4.5" fill="#FFFFFF" fill-opacity=".92"/>
  <rect x="37" y="69" width="170" height="150" rx="29" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="4"/>
  <rect x="35.5" y="67.5" width="173" height="153" rx="30.5" fill="none" stroke="#1E2A4A" stroke-opacity=".22" stroke-width="3"/>
</svg>
