[package]
name = "blurman"
version = "0.9.0"
edition = "2021"
description = "Frosted glass behind the Windows apps you pick"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-collections = "0.2"
windows-core = "0.61"
windows-numerics = "0.2"
# The window: native WinUI 3 through Microsoft's windows-reactor, pinned to a windows-rs commit
# (the crates.io release lacks the tray icon, reopenable windows and the window handle).
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "63a5e3d9b9afbd57c382d0a4f5a367f134e9dc25" }
# WinUI's compositor, for the Apps page's glass preview (src/preview).
winui-composition = { path = "crates/winui-composition" }
windows = { version = "0.61", features = [
    "ApplicationModel",
    "ApplicationModel_Activation",
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Graphics_DirectX",
    "Graphics_Effects",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "63a5e3d9b9afbd57c382d0a4f5a367f134e9dc25" }

# Reactor patched so the window's Mica or Acrylic stays in its active look while another
# window is in front (WinUI's own backdrops go flat). See vendor/windows-reactor.
[patch."https://github.com/microsoft/windows-rs"]
windows-reactor = { path = "vendor/windows-reactor" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
