name: Build and release

# Every push and pull request is built and tested. A push to main whose Cargo.toml version has no
# release yet publishes one, tagged v<version>. The signed version is the Microsoft Store one; the
# Store package is built here too, for uploading in Partner Center.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

# One run at a time on a branch. Two pushes close together would both find the version not yet
# released, and both try to publish it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      # The portable version: blurman.exe and the Windows App Runtime its window needs, which
      # build.rs stages next to it. They stay together, in one folder.
      - name: Portable folder
        shell: pwsh
        run: |
          ./packaging/runtime-files.ps1 -Exe target/release/blurman.exe -Out dist/Blurman
          Compress-Archive -Path dist/Blurman/* -DestinationPath dist/blurman-portable.zip

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: blurman
          path: dist/Blurman

      - name: Is this a new version
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tags = gh api "repos/${{ github.repository }}/tags" --paginate --jq '.[].name'
          # Older releases were tagged v<version>-<commit>. Either form means the version is out.
          $released = ($tags -contains "v$version") -or [bool]($tags -like "v$version-*")
          $publish = "${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main" -and -not $released
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          "publish=$($publish.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          if ($released) { "Version $version is already released. Bump it in Cargo.toml to publish a new one." }

      # The Microsoft Store package, built on every run so the manifest is checked too. It is kept
      # with the run's artifacts, for uploading in Partner Center, and not attached to releases:
      # unsigned, Windows will not install it. The Store signs it when it is published.
      - name: Store package
        shell: pwsh
        run: ./packaging/msix/build.ps1 -Exe target/release/blurman.exe -Out dist

      - name: Upload Store package
        uses: actions/upload-artifact@v7
        with:
          name: blurman-msix
          path: dist/*.msix

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          # The commit this exe was built from, not whatever main points at by now.
          target_commitish: ${{ github.sha }}
          name: Blurman ${{ steps.release.outputs.version }}
          body: |
            **Get the signed version from the [Microsoft Store](https://apps.microsoft.com/detail/9NQ3GQNBM4LK).** Windows trusts it, it works with Smart App Control, and it updates itself.

            `blurman-portable.zip` below is the portable version, with no installer: unzip it anywhere and run `blurman.exe`, keeping the files that come with it in the same folder. It is not signed, so Windows SmartScreen may warn the first time you open it, and Smart App Control may block it.
          files: dist/blurman-portable.zip
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
