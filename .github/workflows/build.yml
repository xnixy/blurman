name: Build

# Every push and pull request is built and tested. Nothing is published from here: the Microsoft
# Store package is built and submitted from a PC (see packaging/msix/STORE.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked
